<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Hacker News Article</title>
    <!-- I choose to add Bootstrap, because naked HTML file looks sooo boring -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">The Hacker News</span>
    </div>
</nav>
<div class="container">
    {% for article in articles %}
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h3 class="card-title">{{ article.title }}</h3>
            <p class="text-muted mb-1">
                <strong>Author:</strong> {{ article.author }}
            </p>
            <p class="text-muted mb-1">
                <strong>Published:</strong> {{ article.pub_date | pretty_date }}
            </p>
            <p class="text-muted mb-2">
                <strong>Modified:</strong> {{ article.mod_date | pretty_date }}
            </p>
            <span class="badge bg-primary mb-3">
                {{ article.tags }}
            </span>
            <hr>
            <p class="card-text" style="white-space: pre-line;">
                {{ article.body }}
            </p>
        </div>
    </div>

    {% endfor %}

</div>

</body>
</html>
